name: metrics

# 用 lowlighter/metrics 生成一张「整页大图」，内容和第三方服务无关：
# 图是 Actions 跑完直接提交回本仓库的 github-metrics.svg，走 raw.githubusercontent。
on:
  schedule:
    - cron: "30 3 * * *"      # UTC 03:30 = 北京时间 11:30（比 snake 晚半小时，错开）
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg
          output_action: commit
          committer_branch: main
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          # 语言占比：不带私有仓库，快
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          # 半年提交热力图
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          # 注：plugin_habits 在只有个人仓库的账号上会抛
          #   TypeError: Cannot destructure property 'author' of 'undefined'
          # 导致图里出现红色错误块，所以不启用。
